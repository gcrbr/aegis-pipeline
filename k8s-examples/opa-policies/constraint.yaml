# Policy Activation: Instantiates the privileged container rule and applies it to specific cluster resources
# This manifest acts as a binding. While the ConstraintTemplate defines the rule logic, 
# this Constraint activates it by targeting Pods specifically in the development namespace.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPPrivilegedContainer # Must match the custom kind defined in your ConstraintTemplate
metadata:
  name: psp-privileged-container # Unique name for this specific policy enforcement instance
spec:
  match:
    kinds:
      - apiGroups: [""] # Core API group
        kinds: ["Pod"]  # Targets Pod resources (including those generated by Deployments or ReplicaSets)
    namespaces:
      - "development"   # Scope Restriction: Enforces this security check only within the development namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-example-role
  namespace: development
rules:
  - apiGroups: [""] # The empty string "" indicates core API resources (Pods, ConfigMaps, Secrets, Services)
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegis-example-role-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: aegis-sa # Must match your ServiceAccount name
    namespace: default
roleRef:
  kind: Role
  name: aegis-example-role # Must match the Role name above
  apiGroup: rbac.authorization.k8s.io